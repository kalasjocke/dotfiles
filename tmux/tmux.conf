# Use a sane prefix
set -g prefix C-a

# Start window index at 1
set -g base-index 1

# Start pane index at 1
setw -g pane-base-index 1

# Highlight window when it has new activity
set -g monitor-activity off
set -g visual-activity off

# Flag windows that ring the bell, but silently: monitor-bell still sets
# window_bell_flag, while bell-action none stops tmux passing the bell on to the
# terminal, which is what was actually making the noise.
set -g bell-action none
set -g visual-bell off

# Re-number windows when one is closed
set -g renumber-windows on

# Enable focus events for auto-reload in Neovim
set -g focus-events on

# Scrollback buffer n lines
set -g history-limit 10000

# Minimal centered status bar at top
set -g status on
set -g status-position top
set -g status-style 'bg=default'
set -g status-left ""
set -g status-right ""
set -g status-justify centre

# Window list styling (Rose Pine). Colours live in the *-style options rather
# than inline #[fg=...] so that window-status-bell-style can take over the whole
# cell when a window rings the bell -- an inline fg would win over it.
set -g window-status-style 'fg=#6e6a86'
set -g window-status-current-style 'fg=#e0def4'
set -g window-status-format '#I'
set -g window-status-current-format '#I'
set -g window-status-bell-style 'fg=#f6c177,bold'
set -g window-status-separator ' '

# Default shell
set -g default-command /bin/zsh
set -g default-shell /bin/zsh

# Split shortcuts
bind h split-window -h -c '#{pane_current_path}'
bind '\' split-window -l 80 -h -c '#{pane_current_path}'
bind v split-window -v -c '#{pane_current_path}'

# Cycle layout instead of the built-in next-layout:
#   even <-> one big main split, the others a fixed 80 columns
bind Space run-shell '~/.config/tmux/cycle-layout.sh'

# New window with claude on the left, shell on the right
bind C new-window \; send-keys 'claude' Enter \; split-window -h

# Window moving shortcuts
bind Left swap-window -t -1
bind Right swap-window -t +1

# Enable mouse
set-option -g mouse on
bind-key -T root PPage if-shell -F "#{alternate_on}" "send-keys PPage" "copy-mode -e; send-keys PPage"

# Scroll in two steps incriments instead of default 5
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# Make pbcopy and pbpaste work
set -g default-command "reattach-to-user-namespace -l zsh"

# Vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDown1Pane send -X clear-selection \; select-pane

# Pane switching with awareness of Vim splits https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Don't rename windows depeding on the running process
set-window-option -g automatic-rename on

# Remove slight delay on esc
set -sg escape-time 1

# Reload config file
bind r source-file ~/.tmux.conf

# Hide status bar (commented out for window indicator)
# set -g status off

# Rose Pine matching pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#6e6a86'
set -g pane-active-border-style 'fg=#6e6a86'


# Hack to have shift + enter work in codex
bind -n S-Enter send-keys "[13;2u"

