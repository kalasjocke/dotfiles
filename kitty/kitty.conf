font_size 16.0
font_family      IosevkaTerm Nerd Font
bold_font        IosevkaTerm Nerd Font
italic_font      IosevkaTerm Nerd Font
bold_italic_font IosevkaTerm Nerd Font

kitty_mod cmd
macos_thicken_font 0.25

cursor_blink_interval 0

placement_strategy top-left

# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME

# Override cursor to bright white
cursor #ffffff
cursor_text_color #191724
